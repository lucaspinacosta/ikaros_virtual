[package]
name = "ikaros-virtual"
version = "0.1.0"
edition = "2024"
description = "A permission-gated Linux desktop owl companion"
default-run = "ikaros-virtual"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gdk-pixbuf = "0.22"
gtk = { package = "gtk4", version = "0.11" }
gtk4-layer-shell = "0.8.1"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
